name: Build

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      VINTAGE_STORY: ${{ github.workspace }}/../vintagestory
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: 10.0.x
      - name: Install test dependency
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libcairo2
      - name: Download game references
        working-directory: ${{ runner.temp }}
        run: |
          curl --fail --location --retry 3 --output server.tar.gz \
            https://cdn.vintagestory.at/gamefiles/stable/vs_server_linux-x64_1.22.7.tar.gz
          printf '%s  %s\n' a7d4a520604590a96de812ee6c6baf4404d43d86cf1ec4fbac1b3a580b52c847 server.tar.gz | sha256sum --check
          mkdir -p "$VINTAGE_STORY"
          tar -xzf server.tar.gz -C "$VINTAGE_STORY"
      - name: Build mod ZIP
        run: python3 build.py
      - name: Test
        run: dotnet run --project test/Test.csproj -c Release
      - name: Upload mod ZIP
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: KuboczochTutorialSkip
          path: dist/KuboczochTutorialSkip-*.zip
          if-no-files-found: error
          compression-level: 0
          retention-days: 30
